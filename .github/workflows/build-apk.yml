name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (report, non bloccante)
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Build APK (debug e ottimizzato)
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discover-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Sul telefono è più comodo scaricare dalla pagina Releases che estrarre uno zip da Actions.
      - name: Publish release "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk discover.apk
          cp app/build/outputs/apk/debug/app-debug.apk discover-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest discover.apk discover-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Discover - ultima build" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}. discover.apk = versione ottimizzata (consigliata); discover-debug.apk = versione di prova, da usare se la prima desse problemi. Entrambe hanno la stessa firma e si installano l'una sopra l'altra."
